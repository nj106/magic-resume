# Magic Resume (魔方简历) for Portainer. Image built by GitHub Actions
# (arm64, GHCR); Watchtower pulls updates daily at 02:00.
services:
  magic-resume:
    image: ghcr.io/nj106/magic-resume:latest
    container_name: magic-resume
    labels:
      - com.centurylinklabs.watchtower.enable=true
    network_mode: bridge
    ports:
      - "8086:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
